[package]
name = "phantom-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tungstenite = { version = "0.20", features = ["tls-native"] }
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
socks = "0.5"
quinn = { version = "0.10", features = ["rustls"] }  # QUIC + ECH
libp2p = { version = "0.48", features = ["tcp-tokio", "noise", "yamux", "dns"] }
rand = "0.8"
