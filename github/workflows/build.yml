name: 🛠 Build Phantom Tunnel (Windows, Linux, Android)

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ——— Windows (.msi) ———
          - target: windows
            os: windows-latest
            setup: |
              rustup target add x86_64-pc-windows-msvc
            build: |
              cargo build --release --target x86_64-pc-windows-msvc
              npx tauri build --target x86_64-pc-windows-msvc
            output_dir: "gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
            output_ext: ".msi"

          # ——— Linux (AppImage) ———
          - target: linux
            os: ubuntu-latest
            setup: |
              rustup target add x86_64-unknown-linux-gnu
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.0-dev libayatana-appindicator3-dev libssl-dev libgtk-3-dev librust-pkg-config libasound2-dev
            build: |
              cargo build --release --target x86_64-unknown-linux-gnu
              npx tauri build --target x86_64-unknown-linux-gnu
            output_dir: "gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
            output_ext: ".AppImage"

          # ——— Android (.apk) ———
          - target: android
            os: ubuntu-latest
            setup: |
              rustup target add aarch64-linux-android
              # Установка Flutter
              git clone https://github.com/flutter/flutter.git --branch stable --depth 1
              export PATH="$PATH:$PWD/flutter/bin"
              flutter doctor --android-licenses
            build: |
              export PATH="$PATH:$PWD/flutter/bin"
              cd mobile
              flutter pub get
              flutter build apk --release --target-platform android-arm64
            output_dir: "mobile/build/app/outputs/flutter-apk"
            output_ext: "-release.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Python (для build-essential)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          ${{ matrix.setup }}
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'windows' && 'x86_64-pc-windows-msvc' || matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'aarch64-linux-android' }}

      - name: Install Tauri CLI
        if: ${{ matrix.target != 'android' }}
        run: |
          npm install -g @tauri-apps/cli

      - name: Build Rust + Tauri (Windows/Linux)
        if: ${{ matrix.target != 'android' }}
        run: |
          ${{ matrix.build }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Android (Flutter)
        if: ${{ matrix.target == 'android' }}
        run: |
          ${{ matrix.build }}

      - name: Find built artifact
        id: find-artifact
        run: |
          ARTIFACT_PATH=$(find ${{ matrix.output_dir }} -name "*${{ matrix.output_ext }}" | head -n1)
          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $ARTIFACT_PATH)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: phantom-tunnel-${{ matrix.target }}-${{ steps.find-artifact.outputs.artifact_name }}
          path: ${{ steps.find-artifact.outputs.artifact_path }}
          if-no-files-found: error